<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creature Stage Gallery</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@400..800&family=Gantari:wght@400..800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20261010f">
  <style>
    .page-gallery .gallery-head { padding-top: 2rem; }
    .gallery-home { white-space: nowrap; }
    .creature-gallery { display: grid; gap: 1.5rem; }
    .species-board { padding: 0; overflow: hidden; }
    .species-heading { display: flex; align-items: baseline; gap: .65rem; padding: 1rem 1.25rem; background: var(--blue); position: relative; margin-bottom: 26px; }
    .species-heading h2 { margin: 0; color: var(--sun); }
    .species-heading span { color: rgba(255, 255, 255, .82); font-weight: 700; }
    .stage-grid { display: grid; grid-template-columns: repeat(3, minmax(140px, 1fr)); gap: .75rem; padding: 0 1.25rem 1.25rem; }
    .stage-card { border-radius: 10px; padding: .7rem; background: var(--cream); text-align: center; }
    .stage-portrait { height: 166px; display: grid; place-items: center; }
    .gallery-creature { width: 154px; }
    .stage-card h3 { margin: 0; text-transform: capitalize; }
    .stage-card small { color: var(--muted); font-weight: 600; }
    @media (max-width: 760px) {
      .stage-grid { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
    }
  </style>
</head>
<body class="page-gallery">
  <main class="gallery-shell">
    <header class="gallery-head">
      <div>
        <h1>All Creature Stages</h1>
      </div>
      <a class="btn btn-soft gallery-home" href="index.html"><span class="icon" aria-hidden="true">arrow_back</span>Back to Game</a>
    </header>
    <div class="creature-gallery" id="creature-gallery"></div>
  </main>

  <script src="js/storage.js?v=20261008m"></script>
  <script src="js/finance.js?v=20261007b"></script>
  <script src="js/creature.js?v=20261010c"></script>
  <script>
    (function () {
      const ids = ["air", "water", "fire", "earth", "metal", "electric", "dark", "fairy", "money"];
      const stages = KipCreature.GOAL_STAGES;
      const gallery = document.getElementById("creature-gallery");

      ids.forEach(function (id) {
        const species = KipStorage.getSpecies(id);
        const board = document.createElement("section");
        board.className = "species-board panel";

        const heading = document.createElement("div");
        heading.className = "species-heading";
        heading.innerHTML = "<h2>" + species.label + " (" + species.element + ")" + "</h2>" +
          (id === "money" ? "<span>Hidden Creature</span>" : "");
        board.appendChild(heading);

        const grid = document.createElement("div");
        grid.className = "stage-grid";
        stages.forEach(function (stage) {
          const data = {
            speciesId: id,
            creature: { age: stage },
            equippedAccessory: "",
            cosmeticColors: {}
          };
          const card = document.createElement("article");
          card.className = "stage-card";
          card.innerHTML = '<div class="stage-portrait">' +
            KipCreature.petMarkup(data, "creature gallery-creature") +
            '</div><h3>' + stage + '</h3><small>' + species.label + '</small>';
          grid.appendChild(card);
        });
        board.appendChild(grid);
        gallery.appendChild(board);
      });
    })();
  </script>
</body>
</html>
