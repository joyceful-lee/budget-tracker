<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budgies</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@400..800&family=Gantari:wght@400..800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20261010a">
</head>
<body class="page-gallery">
  <header class="topbar">
    <a class="brand" href="index.html">Nest Friend</a>
    <div class="topbar-actions">
      <button type="button" class="pill-btn" id="memory-box-open"><span class="icon" aria-hidden="true">inventory_2</span>Memory Box</button>
      <button type="button" class="pill-btn music-toggle" id="music-toggle" aria-pressed="false" title="Turn the background music on"><span class="icon" aria-hidden="true">music_off</span>Music Off</button>
      <button type="button" class="pill-btn pill-danger" data-reset-game><span class="icon" aria-hidden="true">restart_alt</span>Reset Game</button>
    </div>
  </header>

  <main class="gallery-shell">
    <div class="gallery-head">
      <h1>My Budgies</h1>
      <p class="gallery-summary" id="gallery-summary"></p>
    </div>
    <div class="nestie-grid" id="nestie-grid"></div>
  </main>

  <div class="modal" id="onboard-modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="onboard-title">
      <button type="button" class="modal-close" data-close="onboard-modal" id="onboard-close" aria-label="Close"><span class="icon" aria-hidden="true">close</span></button>
      <h2 id="onboard-title">Set a Savings Goal and Hatch a Budgie</h2>

      <form id="onboard-form" class="entry-form" novalidate>
        <label>What Are You Saving For?
          <input type="text" name="goal" maxlength="60" placeholder="New bike" autocomplete="off">
        </label>
        <div class="field-pair">
          <label>Goal Amount
            <input type="number" name="target" min="1" step="0.01" placeholder="200.00">
          </label>
          <label>Deadline
            <input type="date" name="deadline">
          </label>
        </div>
        <label>Pet Name
          <input type="text" name="petName" maxlength="18" placeholder="Pip" autocomplete="off">
        </label>
      </form>

      <p class="field-label">Choose a Device</p>
      <div class="device-choices" id="device-choices" role="listbox" aria-label="Device choices"></div>
      <button type="button" class="link-btn" id="reroll-devices"><span class="icon" aria-hidden="true">refresh</span>Show Other Devices</button>

      <p class="modal-error" id="onboard-error" aria-live="polite"></p>
      <button type="button" class="btn btn-primary" id="hatch-btn"><span class="icon" aria-hidden="true">egg</span>Hatch</button>
    </div>
  </div>

  <div class="hatch-overlay" id="hatch-overlay" hidden>
    <div class="hatch-device" id="hatch-device"></div>
    <p id="hatch-text">The egg is starting to hatch...</p>
  </div>

  <div class="modal" id="memory-modal" hidden>
    <div class="modal-card memory-card wide" role="dialog" aria-modal="true" aria-labelledby="memory-title">
      <button type="button" class="modal-close" data-close="memory-modal" aria-label="Close memory box"><span class="icon" aria-hidden="true">close</span></button>
      <h2 id="memory-title">Memory Box</h2>
      <div class="memory-grid" id="memory-grid"></div>
    </div>
  </div>

  <script src="js/device.js?v=20261010a"></script>
  <script src="js/storage.js?v=20261008m"></script>
  <script src="js/finance.js?v=20261007b"></script>
  <script src="js/creature.js?v=20261010b"></script>
  <script src="js/gallery.js?v=20261010a"></script>
  <script src="js/music.js?v=20261008q"></script>
</body>
</html>
